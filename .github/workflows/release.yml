name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Install Pillow (icon generation)
        run: pip3 install --break-system-packages pillow
      - name: Build demo app
        run: ./scripts/build-demo-app.sh --universal --zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MotiveDemo-*.zip
          generate_release_notes: true
