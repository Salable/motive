name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      # Resources/AppIcon.icns is committed; the build script only
      # regenerates it (needs Pillow) when it's missing.
      - name: Build demo app
        run: ./scripts/build-demo-app.sh --universal --zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MotiveDemo-*.zip
          generate_release_notes: true
