name: Bug report
description: Something is wrong or silent when it should speak
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps — curl commands and UI clicks both welcome.
      placeholder: |
        1. curl -s -X POST localhost:4667/speak -d '{"text":"..."}'
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: dropdown
    id: how-running
    attributes:
      label: How are you running TalkBox?
      options:
        - Packaged TalkBox.app (downloaded release)
        - Packaged TalkBox.app (built locally via tools/package-app.sh)
        - native dev (from a clone)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`native --version`, macOS version, and TalkBox version (GET /openapi.json → info.version)"
      placeholder: "native 0.4.2 / macOS 26.5 / TalkBox 0.7.0"
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: GET /state output (if the server answers)
      description: "`curl -s localhost:4667/state` — redact any reply text you'd rather keep private."
      render: json
