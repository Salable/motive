name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same ref — macOS
# runners are expensive to queue behind stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: the dynamic-tray-icon patch is written against this exact
  # version's sources — an unpinned install would let a CLI release
  # break the patch (and the build) on a random day. Bump both this
  # and the patch together, re-verifying with:
  #   patch -p1 --dry-run -d "$(npm root -g)/@native-sdk/cli" \
  #     < docs/sdk-patches/dynamic-tray-icon.patch
  NATIVE_CLI_VERSION: 0.4.2

jobs:
  test:
    # macos-latest so the runner image tracks whatever GitHub currently
    # supports, rather than pinning a version that may get deprecated.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        # Not preinstalled on macos-latest (xcrun swift-format is);
        # brew is, and this is a small, fast formula.
        run: brew install shellcheck

      - name: Lint (static checks — no toolchain needed)
        # Everything here works on a bare checkout, so it fails in
        # seconds — before any npm/Zig install work.
        run: tools/lint.sh shell swift version forbidden testnames

      - name: Cache the Zig toolchain (downloaded by the Native SDK CLI)
        uses: actions/cache@v4
        with:
          path: ~/.native/toolchains
          key: native-toolchains-${{ runner.os }}-${{ runner.arch }}-cli${{ env.NATIVE_CLI_VERSION }}

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@${{ env.NATIVE_CLI_VERSION }}

      - name: Apply the dynamic-tray-icon SDK patch
        # TalkBox's tray icon swaps live (play/idle/reply-awaiting),
        # which needs a StatusItemState.icon_path field the published
        # CLI doesn't have yet. The patch uses relative (src/...) paths
        # so it applies the same way regardless of where npm installed
        # the package.
        run: patch -p1 -d "$(npm root -g)/@native-sdk/cli" < docs/sdk-patches/dynamic-tray-icon.patch

      - name: Run the test suite (native test)
        # --yes lets a fresh runner (no cache hit yet) download the
        # official Zig 0.16.0 build non-interactively; on a cache hit
        # the toolchain is already there and this is a no-op.
        run: native test --yes

      - name: Lint (zig fmt)
        # Runs AFTER native test on purpose: the Zig toolchain only
        # exists once `native test --yes` has installed it (or the
        # cache restored it) — lint.sh finds it under ~/.native/.
        run: tools/lint.sh zig

      - name: Validate markup + manifest (native check --strict)
        # Runs AFTER test on purpose: test's build graph is what emits
        # zig-out/model-contract.zon, so check gets the full cross-check
        # against the real model instead of a degraded structural-only
        # pass (there's nothing to compare against on a fresh checkout).
        run: native check --strict
